<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Wall</title>
<style>
  :root { --ink:#eaeaea; --mute:#7c7c7c; --bg:#0d0d0d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 14px/1.5 "Helvetica Neue", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { padding: 28px 20px 24px; display:flex; justify-content:space-between; flex-wrap:wrap; gap: 8px 24px; }
  header h1 { font-size: 14px; margin:0; font-weight: 500; }
  header h1 span { color: var(--mute); font-weight: 400; }
  header nav { display:flex; gap: 18px; color: var(--mute); } header nav a:hover { color: var(--ink); }
  .grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 0 4px; }
  .tile { position: relative; overflow:hidden; grid-column: span 2; aspect-ratio: 16/10; background:#000; }
  .tile.big { grid-column: span 3; }
  .tile video, .tile img { width:100%; height:100%; object-fit:cover; display:block; transition: opacity .3s; }
  .tile .cap { position:absolute; inset:auto 0 0 0; padding: 40px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.75));
    opacity: 0; transition: opacity .2s; font-size: 13px; }
  .tile .cap b { font-weight: 500; } .tile .cap span { color: #bbb; }
  .tile:hover .cap { opacity: 1; }
  .about { display:grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 64px 20px 80px; max-width: 1100px; }
  .about p { margin: 0 0 16px; max-width: 460px; color: #bbb; }
  .about h2 { font-size: 12px; font-weight: 400; color: var(--mute); margin: 0 0 10px; }
  .about ul { list-style:none; margin:0 0 28px; padding:0; }
  .about li { display:flex; gap: 16px; padding: 4px 0; }
  .about li span:first-child { width: 64px; flex: none; color: var(--mute); font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; } .tile, .tile.big { grid-column: span 1; } .tile.big:first-child { grid-column: span 2; }
    .tile .cap { opacity: 1; } .about { grid-template-columns: 1fr; }
  }
</style></head><body>
<header id="hdr"></header><div class="grid" id="grid"></div><section class="about" id="about"></section>
<script src="/drafts/data.js"></script>
<script>
const S = SITE;
hdr.innerHTML = `<h1>${S.name} <span>— ${S.role}</span></h1>
  <nav>${S.links.map(l => `<a href="${l.url}">${l.label}</a>`).join("")}<a href="mailto:${S.email}">Email</a></nav>`;
const tile = (g, big) => `<a class="tile${big ? " big" : ""}" href="${g.url}">${media(g)}
  <div class="cap"><b>${g.name}</b> <span>${g.year ? g.year + " · " : ""}${g.role || g.note}</span></div></a>`;
grid.innerHTML = S.games.map(g => tile(g, true)).join("") + S.other.map(g => tile(g)).join("");
const li = (xs) => `<ul>${xs.map(j => `<li><span>${j.years}</span><span>${j.title}, ${j.url ? `<a href="${j.url}">${j.at}</a>` : j.at}</span></li>`).join("")}</ul>`;
about.innerHTML = `<div><p>${S.blurb}</p><p>${S.email}</p></div>
  <div><h2>Work</h2>${li(S.jobs)}<h2>Education</h2>${li(S.education)}</div>`;
playVisible();
</script></body></html>
