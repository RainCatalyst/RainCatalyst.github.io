<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arseny Dremin</title>
<meta name="description" content="Game Programmer">
<meta name="twitter:card" content="summary">
<meta name="twitter:creator" content="@freezed_ice">
<meta property="og:title" content="Arseny Dremin">
<meta property="og:description" content="Game & Systems Programmer">
<meta property="og:image" content="/img/Logo_Icedrop.png">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @font-face { font-family: M; src: url(/fonts/Merriweather-Regular.ttf); }
  @font-face { font-family: M; src: url(/fonts/Merriweather-Bold.ttf); font-weight: 700; }
  :root { --ink: #ececec; --mute: #8f8f8f; --rule: #2a2a2a; --bg: #0e0e0e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 M, Georgia, serif; }
  main { max-width: 750px; margin: 0 auto; padding: 72px 20px 96px; }
  a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  h1 { font-size: 22px; margin: 0; }
  .links { font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 24px; }
  h2 { font-size: 13px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 72px 0 24px; }
  figure { margin: 0 0 56px; }
  figure video, figure img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  figcaption { font-size: 14px; color: var(--mute); margin-top: 10px; }
  figcaption b { color: var(--ink); }
  .small { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 20px; }
  .small figure { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 8px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  td:first-child { width: 90px; color: var(--mute); font-variant-numeric: tabular-nums; }
  footer { margin-top: 72px; font-size: 13px; color: var(--mute); }
  @media (max-width: 560px) {
    main { padding: 48px 12px 72px; }
    .small { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
const email = "arseny.dremin@proton.me";

const links = [
  { label: "CV", url: "/files/CV.pdf" },
  { label: "GitHub", url: "https://github.com/RainCatalyst" },
  { label: "itch.io", url: "https://freezedice.itch.io/" },
  { label: "ArtStation", url: "https://www.artstation.com/raincatalyst" },
  { label: "Email", url: "mailto:" + email },
];

const games = [
  {
    name: "Ultrapool", year: "2025", url: "https://store.steampowered.com/app/4195110/Ultrapool/",
    note: "Pool-inspired roguelike deckbuilder. 100k+ copies sold.",
    role: "Programming, design, tech art · Godot",
    platforms: "Steam · iOS · Android",
    video: "/img/projects/ultrapool.mp4",
  },
  {
    name: "Paleo Pines", year: "2023", url: "https://store.steampowered.com/app/1202200/Paleo_Pines/",
    note: "Cozy dinosaur ranch sim. Gameplay systems, automation, editor tooling.",
    role: "Gameplay programming · Unity",
    platforms: "Steam · Switch · PlayStation · Xbox",
    video: "/img/projects/paleo_new.mp4",
  },
  {
    name: "LOK Digital", year: "2023", url: "https://store.steampowered.com/app/2207440/LOK_Digital/",
    note: "Word-search puzzle adapted from a physical puzzle book. Overwhelmingly Positive on Steam (500+ reviews).",
    role: "Tech art, additional programming · Unity",
    platforms: "Steam · Switch · iOS · Android",
    video: "/img/projects/lok_new.mp4",
  },
  {
    name: "Constellations", year: "2021", url: "https://www.nintendo.com/de-de/Spiele/Nintendo-Switch-Download-Software/Constellations-2384059.html",
    note: "Minimal puzzle game about connecting stars.",
    role: "All programming, shaders, tech art · Godot",
    platforms: "Steam · Switch",
    video: "/img/projects/constellations.mp4",
  },
];

const other = [
  { name: "Game jams", year: "2018–", note: "15+ jam games over 8 years.", url: "https://freezedice.itch.io/", video: "/img/projects/reel_all.mp4" },
  { name: "VFX", note: "Real-time and rendered VFX in Houdini, Blender, Unity.", url: "https://www.artstation.com/raincatalyst", video: "/img/projects/vfx.mp4" },
  { name: "Zeus Renderer", year: "2025", note: "C++ path tracer: volumetrics, PBR, SDF fractals.", url: "https://github.com/RainCatalyst/ZeusRenderer", image: "/img/projects/zeus.png" },
  { name: "Shader toys", note: "Small Godot shader experiments.", url: "https://github.com/RainCatalyst", video: "/img/shaders/blackhole.mp4" },
  { name: "Arduino Raytracer", year: "2024", note: "Fixed-point raytracer on a microcontroller.", url: "https://github.com/RainCatalyst/ArduinoRaytracer", image: "/img/projects/arduino.png" },
  { name: "Ankidot", year: "2024", note: "Godot × Anki for language learning.", url: "https://github.com/RainCatalyst/Ankidot", video: "/img/projects/ankidot.mp4" },
];

const jobs = [
  { years: "2026–", title: "Unity Developer", at: "Forklift Interactive", url: "https://store.steampowered.com/app/3783980/Above_Colonies_of_the_Mist/" },
  { years: "2025–26", title: "Godot Developer", at: "Unannounced 3D action-adventure (NDA)" },
  { years: "2020–", title: "Co-founder, developer", at: "Icedrop Games", url: "https://icedropgames.com/#/games" },
  { years: "2024–25", title: "Teaching Assistant", at: "Saarland University Graphics Lab", url: "https://graphics.cg.uni-saarland.de/" },
  { years: "2022–24", title: "Gameplay Programmer", at: "Italic Pig", url: "https://store.steampowered.com/app/1202200/Paleo_Pines/" },
];

const education = [
  { years: "2023–26", title: "BSc Computer Science", at: "Saarland University" },
  { years: "2022–23", title: "Game Programming", at: "Futuregames, Sweden" },
];

function media(item) {
  if (item.video) return `<video src="${item.video}" muted loop playsinline preload="metadata"></video>`;
  return `<img src="${item.image}" alt="${item.name}" loading="lazy">`;
}

function title(item) {
  return `<b><a href="${item.url}">${item.name}</a></b>${item.year ? `, ${item.year}` : ""}`;
}

function game(g) {
  return `<figure>${media(g)}<figcaption>${title(g)}. ${g.note}<br>${g.role}<br>${g.platforms}</figcaption></figure>`;
}

function small(p) {
  return `<figure>${media(p)}<figcaption>${title(p)}<br>${p.note}</figcaption></figure>`;
}

function rows(list) {
  return `<table>${list.map(r => `<tr><td>${r.years}</td><td>${r.title}, ${r.url ? `<a href="${r.url}">${r.at}</a>` : r.at}</td></tr>`).join("")}</table>`;
}

document.getElementById("app").innerHTML = `
  <h1>Arseny Dremin</h1>
  <div class="links">${links.map(l => `<a href="${l.url}">${l.label}</a>`).join("")}</div>
  <p>Game developer with 5 years of professional experience shipping on PC, console and mobile.<br>
  I have a strong technical background in realtime systems and computer graphics, and I'm looking to apply that beyond games as well.</p>
  <h2>Shipped games</h2>${games.map(game).join("")}
  <h2>Work</h2>${rows(jobs)}
  <h2>Other work</h2><div class="small">${other.map(small).join("")}</div>
  <h2>Education</h2>${rows(education)}
  <footer>${email}</footer>`;

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause());
}, { threshold: 0.25 });
document.querySelectorAll("video").forEach(v => observer.observe(v));
</script>
</body>
</html>
